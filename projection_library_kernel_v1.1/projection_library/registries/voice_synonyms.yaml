# voice_synonyms.yaml — initial coverage (M4)
#
# Lookup table consumed by domain/intake/mapper.py (strategy B:
# synonym match → confidence 0.95). Each entry pairs a voice_id from
# voice_registry.yaml with a list of human-friendly aliases that real
# bilanci tend to use. Italian and English are kept in separate lists
# to make later UX/i18n work explicit, but the runtime lookup treats
# them as one bag (case-insensitive, accent-stripped, ws-collapsed —
# normalization happens in domain/intake/normalize.py).
#
# Coverage status (M4 initial round): pl.rev.* only (23 voices).
# Remaining sections will be added incrementally on top of this file.

