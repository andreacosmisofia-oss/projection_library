validation_rules:
- rule_id: DI_001_required_voices_present
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_pre
  scope:
  - global
  regola_sintesi: all(consuntivo[v][year] is not None for v in required_voices)
  formula_python: "all(v in voices for v in required_voices_tier[project.tier_level])"
  action: use_fallback
  action_note: use_fallback (chain) o halt
  note: Voci richieste mancanti
- rule_id: DI_002_y0_actual_complete
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_pre
  scope:
  - global
  regola_sintesi: all(consuntivo[v][Y0] is not None for v in driver_voices)
  formula_python: "all(voices[v].get('Y0') is not None for v in mapped_voices)"
  action: halt
  action_note: halt_execution
  note: Y0 actual è anchor obbligatorio
- rule_id: DI_003_required_drivers_industrial
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_pre
  scope:
  - per_method
  regola_sintesi: all(driver_data[d] presente per ogni driver richiesto dal metodo)
  formula_python: "len(mapped_voice_ids) == len(set(mapped_voice_ids))"
  action: use_fallback
  action_note: use_fallback o halt
  note: Driver TIER 3+ richiesti
- rule_id: DI_004_required_exogenous_present
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_pre
  scope:
  - per_method
  regola_sintesi: all(exogenous[p] present per ogni metodo che li richiede)
  formula_python: "all(v in voice_registry for v in mapped_voice_ids)"
  action: halt
  action_note: halt o default
  note: Macro CPI per inflation_indexed
- rule_id: DI_005_kpi_calculable
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - per_kpi
  regola_sintesi: numerator_value AND denominator_value AND denominator != 0
  formula_python: "all(m in method_registry for m in configured_method_ids)"
  action: use_fallback
  action_note: use_fallback (KPI = N/A)
  note: Per KPI usati come default
- rule_id: DI_006_assumption_default_filled
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - per_assumption
  regola_sintesi: assumption.value is not None for all years Y1-Y3
  formula_python: "all((voice, asm) in assumptions for voice, method in method_configs.items() for asm in method_registry[method]['assumptions'])"
  action: use_fallback
  action_note: use_fallback (= 0 + warning)
  note: null
- rule_id: DI_007_method_inputs_complete
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - per_method
  regola_sintesi: all(method.inputs are resolvable)
  formula_python: "all(driver_id in drivers for driver_id in required_drivers(method_configs) if not drivers.get(driver_id, {}).get('skipped'))"
  action: halt
  action_note: null
  note: null
- rule_id: DI_008_voice_method_compatibility
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - per_voice
  regola_sintesi: voice.default_method in voice.allowed_methods
  formula_python: "not any(voices[v].get('Y0', 0) > 0 for v in mapped_voices if voice_registry[v]['sign'] == 'negative' and voice_registry[v]['nature'] == 'driver')"
  action: halt
  action_note: null
  note: null
- rule_id: DI_009_no_orphan_references
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - global
  regola_sintesi: for each method.inputs.consuntivo, target voice exists in voice_registry
  formula_python: "custom_function: validators.di_009_acyclicity_check"
  action: halt
  action_note: null
  note: Chiusura P38 Fase 1
- rule_id: DI_010_no_orphan_kpi_references
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - global
  regola_sintesi: for each method.default_kpi_id, kpi exists in kpi_registry
  formula_python: "all(dep in voice_registry for v in voice_registry for dep in voice_dependencies.get(v, {}).get('depends_on_voices', []))"
  action: halt
  action_note: null
  note: Chiusura P38 Fase 1
- rule_id: DI_011_actual_consuntivo_signed_consistent
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_pre
  scope:
  - per_voice
  regola_sintesi: sign(consuntivo[v][year]) matches voice.sign_convention
  formula_python: "not any(voice_registry[v]['nature'] in ('placeholder', 'driver_placeholder') and v in method_configs for v in voice_registry)"
  action: halt
  action_note: null
  note: Costi devono essere negativi nello storico
- rule_id: DI_012_subtotal_consistency_historical
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - global
  regola_sintesi: for each subtotal voice, calculated == stored (tol 0.5%)
  formula_python: "project.sector_pack in sector_pack_registry"
  action: log_and_continue
  action_note: null
  note: Verifica integrità storica
- rule_id: DI_013_balance_check_historical
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - per_year
  regola_sintesi: abs(bs.balance_check[year]) <= max(1.0, 0.0001*total_assets)
  formula_python: "abs(sum(voices[v].get('Y0',0) for v in bs_asset_voices) + sum(voices[v].get('Y0',0) for v in bs_liab_equity_voices)) <= max(1.0, 0.0001 * abs(sum(voices[v].get('Y0',0) for v in bs_asset_voices)))"
  action: halt
  action_note: halt se Y0; warning altrimenti
  note: 'Critico: storico deve quadrare'
- rule_id: DI_014_sector_pack_compatibility
  categoria: data_integrity
  severity: block
  trigger_phases:
  - E0_post
  scope:
  - global
  regola_sintesi: selected sector_pack registered AND required voices populated
  formula_python: "project.horizon_years in (1, 2, 3)"
  action: halt
  action_note: null
  note: null
- rule_id: AI_001_balance_check_projected
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: abs(bs.balance_check[year]) <= max(1.0, 0.0001*abs(total_assets))
  formula_python: "abs(resolve('bs.balance_check', year)) <= max(1.0, 0.0001 * abs(resolve('bs.total_assets', year)))"
  action: log_and_continue
  action_note: log_and_continue (CRITICAL)
  note: Quadratura proiezioni
- rule_id: AI_002_cash_identity
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: bs.nfp.cash[year] == cash[year-1] + cf.net_change_cash[year]
  formula_python: "abs(resolve('bs.nfp.cash', year) - (resolve('bs.nfp.cash', prev_year) + resolve('cf.net_change_cash', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: Tol 0.01
- rule_id: AI_003_retained_earnings_identity
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: RE.close == RE_open + pl.net_income + dividends_paid
  formula_python: "abs(resolve('bs.equity.retained_earnings.close', year) - (resolve('bs.equity.retained_earnings.close', prev_year) + resolve('pl.net_income', year) + resolve('bs.equity.dividends', year) + resolve('bs.equity.buyback', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_004_rou_lease_liability_initial_match
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E4_post
  scope:
  - per_year
  regola_sintesi: bs.fa.rou.new_contracts == -bs.nfp.lease_liability.new_contracts
  formula_python: "abs(resolve('bs.nfp.net_debt', year) - (resolve('bs.nfp.borrowings.balance_close', year) + resolve('bs.nfp.lease_liability.close', year) - resolve('bs.nfp.cash', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: P22 Fase 1
- rule_id: AI_005_subtotal_consistency_projected
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: for each subtotal, calculated == SUM(components)
  formula_python: "custom_function: validators.ai_005_subtotal_consistency"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_006_pl_chain_consistency
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: pl.net_income == pl.ebt + pl.tax.total
  formula_python: "abs(resolve('pl.ebit', year) - (resolve('pl.ebitda.final', year) + resolve('pl.da.total', year) + resolve('pl.impairment.total', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_007_ebitda_definition
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E3_post
  scope:
  - per_year
  regola_sintesi: pl.ebitda == pl.gross_profit + pl.opex.total + pl.provisions.total
  formula_python: "abs(resolve('pl.ebitda.final', year) - (resolve('pl.gross_profit.final', year) + resolve('pl.opex.total', year) + resolve('pl.provisions.total', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_008_ebit_definition
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: pl.ebit == pl.ebitda + pl.da.total + pl.impairment.total
  formula_python: "abs(resolve('pl.ebt', year) - (resolve('pl.ebit', year) + resolve('pl.financial.total_net', year) + resolve('pl.equity_method_result', year) + resolve('pl.other.non_operating_total', year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_009_provisions_balance_consistency
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E5_post
  scope:
  - per_year
  regola_sintesi: 'for each provision: balance_close == balance_open + accrual + usage'
  formula_python: "custom_function: validators.ai_009_provisions_rollforward"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_010_employee_benefits_balance_consistency
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E5_post
  scope:
  - per_year
  regola_sintesi: EB.balance_close == open + service_cost + interest_cost - payments + actuarial
  formula_python: "custom_function: validators.ai_010_eb_rollforward"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: AI_011_nwc_change_consistency
  categoria: accounting_identity
  severity: error
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: cf.operating.nwc_change == -(bs.nwc.operating[t] - [t-1])
  formula_python: "abs(resolve('cf.operating.nwc_change', year) - (resolve('bs.nwc.operating.final', year) - resolve('bs.nwc.operating.final', prev_year))) <= 0.01"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_001_revenues_positive
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E1_post
  scope:
  - per_year
  regola_sintesi: pl.rev.gross.{voice}[year] >= 0 for all gross voices
  formula_python: "resolve('pl.rev.gross_total', year) >= 0"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_002_costs_negative
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E1_post
  scope:
  - per_year
  regola_sintesi: pl.cogs.* and pl.opex.* are <= 0 (escluso wip_capitalization)
  formula_python: "resolve('pl.cogs.total.final', year) <= 0"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_003_assets_positive
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E2_post
  - E3_post
  scope:
  - per_year
  regola_sintesi: bs.fa.*.net_close >= 0 AND NWC asset voices >= 0
  formula_python: "all(resolve(v, year) >= 0 for v in bs_asset_voices if voice_registry[v]['sign'] == 'positive')"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_004_liabilities_negative
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E3_post
  - E4_post
  scope:
  - per_year
  regola_sintesi: bs.nwc.ap.trade <= 0 AND borrowings <= 0 AND lease_liability <= 0 AND provisions <= 0 AND EB <= 0 AND DTL
    <= 0
  formula_python: "all(resolve(v, year) <= 0 for v in bs_liab_voices if voice_registry[v]['sign'] == 'negative')"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_005_equity_components
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: share_capital >= 0; RE may be ±; total_close consistency
  formula_python: "resolve('pl.tax.current', year) <= 0"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_006_cash_positive
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: bs.nfp.cash[year] >= 0 (overdraft → reclassify in RCF)
  formula_python: "resolve('pl.da.total', year) <= 0"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_007_da_negative
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E2_post
  scope:
  - per_year
  regola_sintesi: pl.da.ppe/intangibles/rou <= 0
  formula_python: "resolve('pl.ebitda.final', year) > -abs(resolve('pl.rev.gross_total', year))"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_008_interest_expense_negative
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E4_post
  scope:
  - per_year
  regola_sintesi: pl.financial.interest_expense <= 0 AND lease_interest <= 0
  formula_python: "resolve('pl.financial.interest_expense', year) <= 0"
  action: log_and_continue
  action_note: null
  note: null
- rule_id: SC_009_dividends_negative
  categoria: sign_consistency
  severity: error
  trigger_phases:
  - E6_post
  scope:
  - per_year
  regola_sintesi: bs.equity.capital.dividends_paid <= 0 (riduce equity)
  formula_python: "resolve('bs.nfp.cash', year) >= 0"
  action: log_and_continue
  action_note: null
  note: Sign convention IFRS
- rule_id: RP_001_revenue_growth_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: -50% <= kpi.growth.revenue_yoy[year] <= +200%
  formula_python: "safe_div(resolve('pl.rev.net.final', year) - resolve('pl.rev.net.final', prev_year), abs(resolve('pl.rev.net.final', prev_year))) >= -0.50"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_002_gross_margin_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: -100% <= kpi.margin.gross[year] <= +95%
  formula_python: "safe_div(resolve('pl.gross_profit.final', year), resolve('pl.rev.net.final', year)) >= -1.00"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_003_ebitda_margin_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: -100% <= kpi.margin.ebitda[year] <= +60%
  formula_python: "safe_div(resolve('pl.ebitda.final', year), resolve('pl.rev.net.final', year)) >= -0.50"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_004_dso_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0 <= kpi.nwc.dso[year] <= 365
  formula_python: "safe_div(resolve('bs.nwc.ar.trade_gross', year) * 365, resolve('pl.rev.net.final', year)) <= 365"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_005_dio_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0 <= kpi.nwc.dio_total[year] <= 730
  formula_python: "safe_div(resolve('bs.nwc.inventory.total', year) * 365, abs(resolve('pl.cogs.total.final', year))) <= 365"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_006_dpo_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0 <= kpi.nwc.dpo[year] <= 365
  formula_python: "safe_div(abs(resolve('bs.nwc.ap.trade', year)) * 365, abs(resolve('pl.cogs.total.final', year))) <= 365"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_007_ccc_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: -180 <= kpi.nwc.ccc[year] <= 365
  formula_python: "safe_div(resolve('bs.nfp.net_debt', year), abs(resolve('pl.ebitda.final', year))) <= 10.0"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_008_capex_intensity_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0% <= kpi.fa.capex_intensity_total[year] <= 50%
  formula_python: "safe_div(resolve('pl.ebitda.final', year), abs(resolve('pl.financial.interest_expense', year))) >= 1.0"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_009_capex_to_da_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0 <= kpi.fa.capex_to_da_ratio[year] <= 5
  formula_python: "0.0 <= assumptions.get('pl.tax.current', {}).get('etr', {}).get(year, 0.25) <= 0.60"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_010_useful_life_implied_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 1 <= kpi.fa.useful_life_implied_ppe <= 50
  formula_python: "safe_div(abs(resolve('cf.investing.capex.total', year)), resolve('pl.rev.net.final', year)) <= 0.50"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_011_lease_term_implied_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 1 <= kpi.fa.lease_term_implied <= 30
  formula_python: "safe_div(abs(resolve('pl.da.total', year)), resolve('bs.fa.tangible.gross_close', year) + 0.01) <= 0.50"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_012_nd_to_ebitda_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: -3 <= kpi.nfp.nd_to_ebitda <= 10
  formula_python: "safe_div(resolve('pl.provisions.total', year), resolve('pl.rev.net.final', year)) >= -0.20"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_013_icr_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: kpi.nfp.icr_ebit >= 0.5 (covenant risk threshold)
  formula_python: "safe_div(resolve('pl.opex.labour.total', year), resolve('pl.rev.net.final', year)) >= -0.80"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_014_cost_of_debt_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0% <= kpi.nfp.cost_of_debt <= 25%
  formula_python: "custom_function: validators.rp_014_revenue_per_head"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_015_lease_implicit_rate_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E8_post
  scope:
  - per_year
  regola_sintesi: 0% <= kpi.nfp.lease_implicit_rate <= 15%
  formula_python: "safe_div(resolve('bs.nwc.operating.final', year), resolve('pl.rev.net.final', year)) >= -0.50"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_016_etr_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: 0% <= kpi.tax.etr <= 50%
  formula_python: "resolve('bs.equity.total_close', year) > 0"
  action: log_warning
  action_note: null
  note: null
- rule_id: RP_017_payout_ratio_plausible
  categoria: range_plausibility
  severity: warning
  trigger_phases:
  - E7_post
  scope:
  - per_year
  regola_sintesi: 0% <= kpi.equity.payout_ratio <= 200%
  formula_python: "resolve('pl.impairment.goodwill', year) >= -resolve('bs.fa.goodwill.net_close', prev_year)"
  action: log_warning
  action_note: null
  note: null
