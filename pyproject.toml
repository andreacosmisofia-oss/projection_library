[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ch-label-extractor"
version = "0.1.0"
description = "Extract (label, XBRL-tag) pairs from Companies House iXBRL bulk data"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "polars>=0.20",
    "httpx>=0.27",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.scripts]
ch-recon    = "ch_labels.recon:main"
ch-fetch    = "ch_labels.fetch:main"
ch-extract  = "ch_labels.extract:main"
ch-aggregate = "ch_labels.aggregate:main"
ch-taxonomy = "ch_labels.taxonomy:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ch_labels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
